version: "v1"
id: "task_chat_spotify"
instruction_de: "Finde das Lied, das Lena zuletzt im Chat empfohlen hat, und füge es zu Favoriten hinzu."
criticality: "low"
trigger:
  reference_phrases:
    - "Finde das Lied, das Lena zuletzt im Chat empfohlen hat, und füge es zu Favoriten hinzu."
  required_concepts:
    - ["lied", "song"]
    - ["lena"]
    - ["chat", "nachricht"]
    - ["favoriten", "favorit"]
  forbidden_concepts: ["kalender", "rechnung", "überweisung", "ueberweisung", "whiteboard"]
  wake_words: ["jarvis", "caddie"]
required_packages:
  - "com.caddie.studytelegram"
  - "com.spotify.music"
seeded_artifacts:
  - "Caddie Study Telegram Lena Song Recommendation"
  - "Recommended Song: As It Was"
reset_checklist:
  - "Verify Lena song recommendation in Study Telegram"
  - "Remove song from Favoriten if added"
  - "reset Study Telegram via com.caddie.studytelegram.ACTION_RESET"
steps:
  - id: "chat_open"
    action: "open com.caddie.studytelegram"
    narration: "Chat wird geöffnet..."
    step_type: "normal"
    min_narration_ms: 400
  - id: "find_recommendation"
    action: "click 'Lena'"
    narration: "Letzte Empfehlung von Lena finden..."
    step_type: "consequential"
    consequential: true
    min_narration_ms: 800
  - id: "search_song"
    action: "open com.spotify.music"
    narration: "Lied in Spotify suchen..."
    step_type: "normal"
    min_narration_ms: 600
  - id: "open_search"
    action: "click 'Suchen'"
    narration: "Spotify-Suche öffnen..."
    step_type: "normal"
  - id: "input_song"
    action: "input text 'As It Was' (submit)"
    narration: "Empfohlenes Lied suchen..."
    step_type: "normal"
    error_variant:
      id: "err_song_title"
      field: "song_title"
      wrong_value: "As It Was (Extended)"
      correct_value: "As It Was"
      description: "Falscher Liedtitel gesucht und zu Favoriten hinzugefügt"
  - id: "add_favoriten"
    action: "click 'Zu Lieblingssongs hinzufügen'"
    narration: "Lied zu Favoriten hinzufügen..."
    step_type: "commit"
    commit: true
    min_narration_ms: 800
error_steps: ["input_song"]
c2_summary_lines:
  - "Lied gesucht: As It Was (Extended) (falsch, korrekt wäre As It Was)"
verification:
  - id: "v_song_added"
    assertion: "Lied wurde zu Favoriten hinzugefügt"
    check_type: "text_present"
    parameters:
      text: "Favoriten"
    screenshot_evidence: true
max_duration_s: 120
per_gate_timeout_s: 30
