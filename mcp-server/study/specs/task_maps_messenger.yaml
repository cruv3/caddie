version: "v1"
id: "task_maps_messenger"
instruction_de: "Ermittle die Ankunftszeit mit öffentlichen Mitteln und sende sie."
criticality: "low"
trigger:
  reference_phrases:
    - "Ermittle die Ankunftszeit mit öffentlichen Mitteln und sende sie."
  required_concepts:
    - ["ankunftszeit", "ankunft"]
    - ["öffentlichen mitteln", "oeffentlichen mitteln", "öffentliche verkehrsmittel", "oeffentliche verkehrsmittel", "öpnv", "oepnv"]
    - ["sende", "senden", "schicke", "schicken"]
  forbidden_concepts: ["fotos", "playlist", "checkliste", "überweisung", "ueberweisung"]
  wake_words: ["jarvis", "caddie"]
required_packages: ["com.caddie"]
seeded_artifacts: ["Caddie Study Contact"]
reset_checklist: ["Clear study route"]
steps:
  - id: "maps_open"
    action: "open com.caddie/.MainActivity"
    narration: "Karte wird geöffnet..."
    step_type: "normal"
    min_narration_ms: 400
  - id: "search_route"
    action: "input text 'Route to Station'"
    narration: "Route suchen..."
    step_type: "consequential"
    consequential: true
    min_narration_ms: 800
  - id: "share_time"
    action: "click 'Share Arrival Time'"
    narration: "Ankunftszeit senden..."
    step_type: "commit"
    commit: true
    min_narration_ms: 1200
error_steps: []
verification:
  - id: "v_time_shared"
    assertion: "Ankunftszeit im Gespräch sichtbar"
    check_type: "text_present"
    parameters: { text: "Ankunft" }
    screenshot_evidence: true
max_duration_s: 120
per_gate_timeout_s: 30
