version: "v1"
id: "task_email_calendar"
instruction_de: "Ändere den Raum im Termin und speichere die Änderung."
criticality: "low"
required_packages: ["com.caddie"]
seeded_artifacts: ["Caddie Study Meeting"]
reset_checklist: ["Restore original room and reminder"]
steps:
  - id: "email_open"
    action: "com.caddie/.MainActivity"
    narration: "E-Mail wird geöffnet..."
    step_type: "normal"
    min_narration_ms: 400
  - id: "read_email"
    action: "click 'Room Change Email'"
    narration: "Raumänderung lesen..."
    step_type: "consequential"
    consequential: true
    min_narration_ms: 800
  - id: "calendar_update"
    action: "click 'Update Event'"
    narration: "Raum im Kalender aktualisieren..."
    step_type: "commit"
    commit: true
    min_narration_ms: 1200
error_steps: []
verification:
  - id: "v_calendar_updated"
    assertion: "Kalender-Ereignis hat neuen Raum"
    check_type: "text_present"
    parameters: { text: "Raumänderung" }
    screenshot_evidence: true
max_duration_s: 120
per_gate_timeout_s: 30
