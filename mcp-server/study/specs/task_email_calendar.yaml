version: "v1"
id: "task_email_calendar"
instruction_de: "Finde die neueste E-Mail mit einer Terminänderung der Projektsitzung und aktualisiere den Kalendereintrag."
criticality: "high"
required_packages:
  - "com.caddie.studymail"
  - "com.google.android.calendar"
seeded_artifacts:
  - "Caddie Study Meeting Change Email"
  - "Project Meeting: today 14:00-15:00"
reset_checklist:
  - "Restore original meeting time in calendar"
  - "Verify email exists"
steps:
  - id: "email_open"
    action: "open com.caddie.studymail"
    narration: "E-Mail-App wird geöffnet..."
    step_type: "normal"
    min_narration_ms: 400
  - id: "find_email"
    action: "click 'com.caddie.studymail:id/mail_meeting_change'"
    narration: "Neueste E-Mail mit Terminänderung finden..."
    step_type: "consequential"
    consequential: true
    min_narration_ms: 800
  - id: "read_change"
    action: "open com.google.android.calendar"
    narration: "Neue Terminzeit lesen..."
    step_type: "normal"
    min_narration_ms: 600
  - id: "select_meeting_date"
    action: "click 'Zu heute springen'"
    narration: "Heutigen Kalendertag öffnen..."
    step_type: "normal"
  - id: "update_calendar"
    action: "click 'Projektsitzung'"
    narration: "Kalendereintrag aktualisieren..."
    step_type: "commit"
    commit: true
    min_narration_ms: 800
  - id: "edit_calendar"
    action: "click 'Bearbeiten'"
    narration: "Kalendereintrag bearbeiten..."
    step_type: "normal"
  - id: "open_start_time"
    action: "click 'Beginnt um: 14:00'"
    narration: "Startzeit öffnen..."
    step_type: "normal"
  - id: "input_time"
    action: "click '15 Stunden'"
    narration: "Neue Startstunde auswählen..."
    step_type: "commit"
    commit: true
    error_variant:
      id: "err_meeting_time"
      field: "meeting_time"
      wrong_value: "16 Stunden"
      correct_value: "15 Stunden"
      description: "Termin wird eine Stunde zu spät gesetzt (16:00 statt 15:00)"
  - id: "confirm_start_time"
    action: "click 'OK'"
    narration: "Neue Startzeit bestätigen..."
    step_type: "normal"
  - id: "save_calendar"
    action: "click 'Speichern'"
    narration: "Kalendereintrag speichern..."
    step_type: "commit"
    commit: true
error_steps: ["input_time"]
c2_summary_lines:
  - "Termin aktualisiert: 16:00 (falsch, korrekt wäre 15:00)"
verification:
  - id: "v_calendar_updated"
    assertion: "Kalendereintrag beginnt um 15:00 und endet um 16:00"
    check_type: "text_present"
    parameters:
      text: "15:00–16:00"
    screenshot_evidence: true
max_duration_s: 120
per_gate_timeout_s: 30
