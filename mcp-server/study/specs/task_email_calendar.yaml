version: "v1"
id: "task_email_calendar"
instruction_de: "Finde die neueste E-Mail mit einer Terminänderung der Projektsitzung und aktualisiere den Kalendereintrag."
criticality: "high"
trigger:
  reference_phrases:
    - "Finde die neueste E-Mail mit einer Terminänderung der Projektsitzung und aktualisiere den Kalendereintrag."
  required_concepts:
    - ["e-mail", "email"]
    - ["terminänderung", "terminaenderung", "projektsitzung"]
    - ["kalendereintrag", "kalender"]
    - ["aktualisiere", "aktualisieren"]
  forbidden_concepts: ["prüfung", "pruefung", "nicht stören", "nicht stoeren", "dnd", "rechnung", "überweisung", "ueberweisung", "whiteboard"]
  wake_words: ["jarvis", "caddie"]
required_packages:
  - "com.caddie.studymail"
  - "com.caddie.studycalendar"
seeded_artifacts:
  - "Caddie Study Meeting Change Email"
  - "Project Meeting: today 14:00-15:00"
reset_checklist:
  - "Restore original meeting time in calendar"
  - "Verify email exists"
steps:
  - id: "email_open"
    action: "open com.caddie.studymail"
    narration: "E-Mail-App wird geöffnet..."
    step_type: "normal"
    min_narration_ms: 400
  - id: "find_email"
    action: "click 'com.caddie.studymail:id/mail_meeting_change'"
    narration: "Neueste E-Mail mit Terminänderung finden..."
    step_type: "consequential"
    consequential: true
    min_narration_ms: 800
  - id: "calendar_open"
    action: "open com.caddie.studycalendar/.StudyCalendarActivity"
    narration: "Kalender wird geöffnet..."
    step_type: "normal"
    min_narration_ms: 600
  - id: "meeting_open"
    action: "click 'com.caddie.studycalendar:id/meeting_event'"
    narration: "Projektsitzung wird geöffnet..."
    step_type: "normal"
  - id: "meeting_edit"
    action: "click 'com.caddie.studycalendar:id/edit_event'"
    narration: "Termin wird bearbeitet..."
    step_type: "normal"
  - id: "time_open"
    action: "click 'com.caddie.studycalendar:id/start_time'"
    narration: "Startzeit wird geöffnet..."
    step_type: "normal"
  - id: "time_select"
    action: "click 'com.caddie.studycalendar:id/hour_15'"
    narration: "Startzeit 15 Uhr wird ausgewählt..."
    step_type: "consequential"
    error_variant:
      id: "err_wrong_calendar_hour"
      field: "start_hour"
      wrong_value: "hour_16"
      correct_value: "hour_15"
      description: "Startzeit wird versehentlich auf 16 Uhr gesetzt"
  - id: "time_confirm"
    action: "click 'com.caddie.studycalendar:id/confirm_time'"
    narration: "Startzeit wird übernommen..."
    step_type: "consequential"
  - id: "meeting_save"
    action: "click 'com.caddie.studycalendar:id/save_event'"
    narration: "Terminänderung wird gespeichert..."
    step_type: "commit"
    commit: true
error_steps: ["time_select"]
c2_summary_lines:
  - "Termin aktualisiert: 16:00 (falsch, korrekt wäre 15:00)"
verification:
  - id: "v_calendar_updated"
    assertion: "Kalendereintrag beginnt um 15:00 und endet um 16:00"
    check_type: "text_present"
    parameters:
      text: "15:00–16:00 Uhr"
    screenshot_evidence: true
max_duration_s: 120
per_gate_timeout_s: 30
