version: "v1"
id: "task_banking_payment"
instruction_de: "Finde die neueste offene Rechnung im E-Mail-Posteingang und bezahle sie in der Banking-App."
criticality: "high"
trigger:
  reference_phrases:
    - "Finde die neueste offene Rechnung im E-Mail-Posteingang und bezahle sie in der Banking-App."
  required_concepts:
    - ["offene rechnung", "rechnung"]
    - ["e-mail", "email", "posteingang"]
    - ["bezahle", "bezahlen", "zahlung"]
    - ["banking", "banking-app"]
  forbidden_concepts: ["kalender", "prüfung", "pruefung", "whiteboard", "spotify"]
  wake_words: ["jarvis", "caddie"]
required_packages:
  - "com.caddie.studymail"
  - "com.caddie.studybank"
seeded_artifacts:
  - "Offene Rechnung über 30,00 EUR von Study Vendor GmbH"
  - "Sparkasse-Mockkonto mit 40,00 EUR Guthaben"
reset_checklist:
  - "Clear bank payment form"
  - "Verify invoice in inbox"
steps:
  - id: "email_open"
    action: "open com.caddie.studymail"
    narration: "E-Mail-Posteingang wird geöffnet..."
    step_type: "normal"
    min_narration_ms: 400
  - id: "find_invoice"
    action: "click 'com.caddie.studymail:id/mail_invoice'"
    narration: "Offene Rechnung finden..."
    step_type: "consequential"
    consequential: true
    min_narration_ms: 800
  - id: "open_bank"
    action: "open com.caddie.studybank"
    narration: "Banking-App wird geöffnet..."
    step_type: "normal"
    min_narration_ms: 600
  - id: "open_transfer"
    action: "click 'com.caddie.studybank:id/btn_open_transfer'"
    narration: "Neue Überweisung öffnen..."
    step_type: "normal"
    min_narration_ms: 400
  - id: "focus_recipient"
    action: "click 'com.caddie.studybank:id/transfer_recipient'"
    narration: "Empfängerfeld auswählen..."
    step_type: "normal"
  - id: "input_recipient"
    action: "input text 'Study Vendor GmbH'"
    narration: "Empfänger eingeben..."
    step_type: "normal"
  - id: "focus_iban"
    action: "click 'com.caddie.studybank:id/transfer_iban'"
    narration: "IBAN-Feld auswählen..."
    step_type: "normal"
  - id: "input_iban"
    action: "input text 'DE02120300000000202051'"
    narration: "IBAN eingeben..."
    step_type: "normal"
  - id: "focus_amount"
    action: "click 'com.caddie.studybank:id/transfer_amount'"
    narration: "Betragsfeld auswählen..."
    step_type: "normal"
  - id: "input_amount"
    action: "input text '30.00'"
    narration: "Rechnungsbetrag eingeben..."
    step_type: "consequential"
    consequential: true
    error_variant:
      id: "err_payment_amount"
      field: "payment_amount"
      wrong_value: "80.00"
      correct_value: "30.00"
      description: "Rechnungsbetrag wird falsch eingegeben: 80,00 statt 30,00 EUR"
    min_narration_ms: 800
  - id: "focus_purpose"
    action: "click 'com.caddie.studybank:id/purpose_text'"
    narration: "Verwendungszweckfeld auswählen..."
    step_type: "normal"
  - id: "input_purpose"
    action: "input text 'Rechnung INV-2026-001'"
    narration: "Verwendungszweck eingeben..."
    step_type: "normal"
  - id: "hide_keyboard"
    action: "press BACK"
    narration: "Tastatur schließen..."
    step_type: "normal"
  - id: "review_payment"
    action: "click 'com.caddie.studybank:id/btn_send'"
    narration: "Überweisungsdaten prüfen..."
    step_type: "consequential"
    consequential: true
    min_narration_ms: 600
  - id: "send_payment"
    action: "click 'com.caddie.studybank:id/btn_confirm'"
    narration: "Überweisung senden..."
    step_type: "commit"
    commit: true
    min_narration_ms: 800
error_steps: ["input_amount"]
c2_summary_lines:
  - "Zahlungsbetrag: 80,00 EUR (falsch, korrekt wäre 30,00 EUR)"
verification:
  - id: "v_payment_completed"
    assertion: "Überweisung erscheint in den Umsätzen und die Kontoübersicht ist sichtbar"
    check_type: "text_present"
    parameters:
      text: "Study Vendor GmbH"
    screenshot_evidence: true
max_duration_s: 120
per_gate_timeout_s: 30
