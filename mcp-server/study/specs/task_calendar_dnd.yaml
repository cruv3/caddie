version: "v1"
id: "task_calendar_dnd"
instruction_de: "Finde die Prüfung morgen im Kalender und aktiviere Nicht stören für diese Zeit."
criticality: "low"
trigger:
  reference_phrases:
    - "Finde die Prüfung morgen im Kalender und aktiviere Nicht stören für diese Zeit."
  required_concepts:
    - ["prüfung", "pruefung", "exam"]
    - ["kalender", "termin"]
    - ["nicht stören", "nicht stoeren", "dnd"]
  forbidden_concepts: ["projektsitzung", "überweisung", "ueberweisung", "fotos"]
  wake_words: ["jarvis", "caddie"]
required_packages: ["com.caddie.studycalendar", "com.android.settings"]
seeded_artifacts: ["Prüfung morgen von 10:00–11:00 Uhr"]
reset_checklist: ["Nicht stören deaktivieren"]
steps:
  - id: "calendar_open"
    action: "open com.caddie.studycalendar/.StudyCalendarActivity"
    narration: "Kalender wird geöffnet..."
    step_type: "normal"
    min_narration_ms: 400
  - id: "exam_open"
    action: "click 'com.caddie.studycalendar:id/exam_event'"
    narration: "Prüfungstermin wird geöffnet..."
    step_type: "normal"
  - id: "dnd_settings_open"
    action: "open com.android.settings/.Settings"
    narration: "Android-Einstellungen werden geöffnet..."
    step_type: "normal"
  - id: "dnd_modes_open"
    action: "click 'Modi'"
    narration: "Android-Modi werden geöffnet..."
    step_type: "normal"
  - id: "dnd_mode_open"
    action: "click 'Bitte nicht stören'"
    narration: "Nicht-stören-Modus wird ausgewählt..."
    step_type: "consequential"
  - id: "dnd_enable"
    action: "click 'Jetzt aktivieren'"
    narration: "Nicht stören wird für die Prüfungszeit aktiviert..."
    step_type: "commit"
  - id: "calendar_verify_open"
    action: "open com.caddie.studycalendar/.StudyCalendarActivity"
    narration: "Prüfungstermin wird abschließend geprüft..."
    step_type: "normal"
error_steps: []
verification:
  - id: "exam_time_visible"
    assertion: "Prüfungszeit ist 10 bis 11 Uhr"
    check_type: "text_present"
    parameters: { text: "10:00–11:00 Uhr" }
    screenshot_evidence: true
max_duration_s: 120
per_gate_timeout_s: 30
