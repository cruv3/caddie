version: "v1"
id: "task_banking_payment"
instruction_de: "Finde die neueste offene Rechnung im E-Mail-Posteingang und bezahle sie in der Banking-App."
participant_briefing:
  situation_de: "Eine offene Rechnung ist fällig. Die Überweisungsdaten stehen in der neuesten Rechnungsmail. Die Zahlung findet ausschließlich in einer lokalen Banking-Demo statt; es wird kein echtes Geld bewegt."
  apps:
    - name: "Mail"
      purpose_de: "Die neueste offene Rechnung und ihre Überweisungsdaten finden."
    - name: "Banking-Demo"
      purpose_de: "Die Rechnungsdaten prüfen, eintragen und die Demo-Zahlung abschließen."
  goal_de: "Empfänger, IBAN, Betrag und Verwendungszweck entsprechen der Rechnung und die lokale Demo-Zahlung ist abgeschlossen."
  preparation_de: "Öffne auf dem Studien-Smartphone Mail und lies die neueste offene Rechnung mit Empfänger, IBAN, Betrag und Verwendungszweck. Verändere dabei nichts und lege das Smartphone danach wieder vor dir ab."
criticality: "high"
trigger:
  reference_phrases:
    - "Finde die neueste offene Rechnung im E-Mail-Posteingang und bezahle sie in der Banking-App."
  required_concepts:
    - ["offene rechnung", "rechnung"]
    - ["e-mail", "email", "posteingang"]
    - ["bezahle", "bezahlen", "zahlung"]
    - ["banking", "banking-app"]
  forbidden_concepts: ["kalender", "prüfung", "pruefung", "whiteboard", "spotify"]
  wake_words: ["jarvis", "caddie"]
required_packages:
  - "com.caddie.studymail"
  - "com.caddie.studybank"
seeded_artifacts:
  - "Offene Rechnung über 30,00 EUR von Study Vendor GmbH"
  - "Sparkasse-Mockkonto mit 40,00 EUR Guthaben"
reset_checklist:
  - "Clear bank payment form"
  - "Verify invoice in inbox"
steps:
  - id: "email_open"
    action: "open com.caddie.studymail"
    narration: "E-Mail-Posteingang wird geöffnet..."
    confirmation_text: "E-Mail öffnen"
    step_type: "normal"
    min_narration_ms: 400
  - id: "find_invoice"
    action: "click 'com.caddie.studymail:id/mail_invoice'"
    narration: "Offene Rechnung finden..."
    confirmation_text: "Neueste offene Rechnung öffnen"
    step_type: "consequential"
    consequential: true
    min_narration_ms: 800
  - id: "open_bank"
    action: "open com.caddie.studybank"
    narration: "Banking-App wird geöffnet..."
    confirmation_text: "Sparkasse öffnen"
    step_type: "normal"
    min_narration_ms: 600
  - id: "open_transfer"
    action: "click 'com.caddie.studybank:id/btn_open_transfer'"
    narration: "Neue Überweisung öffnen..."
    confirmation_text: "Neue Überweisung öffnen"
    step_type: "normal"
    min_narration_ms: 400
  - id: "focus_recipient"
    action: "click 'com.caddie.studybank:id/transfer_recipient'"
    narration: "Empfängerfeld auswählen..."
    confirmation_text: "Empfängerfeld auswählen"
    step_type: "normal"
    confirm_in_c1: false
  - id: "input_recipient"
    action: "input text 'Study Vendor GmbH'"
    narration: "Empfänger eingeben..."
    confirmation_text: "Empfänger „Study Vendor GmbH“ eingeben"
    step_type: "normal"
  - id: "focus_iban"
    action: "click 'com.caddie.studybank:id/transfer_iban'"
    narration: "IBAN-Feld auswählen..."
    confirmation_text: "IBAN-Feld auswählen"
    step_type: "normal"
    confirm_in_c1: false
  - id: "input_iban"
    action: "input text 'DE02120300000000202051'"
    narration: "IBAN eingeben..."
    confirmation_text: "IBAN „DE02120300000000202051“ eingeben"
    step_type: "normal"
  - id: "focus_amount"
    action: "click 'com.caddie.studybank:id/transfer_amount'"
    narration: "Betragsfeld auswählen..."
    confirmation_text: "Betragsfeld auswählen"
    step_type: "normal"
    confirm_in_c1: false
  - id: "input_amount"
    action: "input text '30.00'"
    narration: "Rechnungsbetrag eingeben..."
    confirmation_text: "Rechnungsbetrag 30,00 Euro eingeben"
    step_type: "consequential"
    consequential: true
    error_variant:
      id: "err_payment_amount"
      field: "payment_amount"
      wrong_value: "80.00"
      correct_value: "30.00"
      summary_wrong_value: "80,00"
      summary_correct_value: "30,00"
      description: "Rechnungsbetrag wird falsch eingegeben: 80,00 statt 30,00 EUR"
      correction:
        after_commit: "reject_irreversible"
        rewind_to_step_id: "focus_amount"
        rewind_steps:
          - id: "return_to_payment_form"
            action: "press BACK"
            narration: "Zum Überweisungsformular zurückkehren"
            confirmation_text: "Zurück zum Überweisungsformular"
        irreversible_message_de: "Tut mir leid, die Überweisung wurde bereits gesendet und kann hier nicht mehr geändert werden."
    min_narration_ms: 800
  - id: "focus_purpose"
    action: "click 'com.caddie.studybank:id/purpose_text'"
    narration: "Verwendungszweckfeld auswählen..."
    confirmation_text: "Verwendungszweckfeld auswählen"
    step_type: "normal"
    confirm_in_c1: false
  - id: "input_purpose"
    action: "input text 'Rechnung INV-2026-001'"
    narration: "Verwendungszweck eingeben..."
    confirmation_text: "Verwendungszweck „Rechnung INV-2026-001“ eingeben"
    step_type: "normal"
  - id: "hide_keyboard"
    action: "press BACK"
    narration: "Tastatur schließen..."
    confirmation_text: "Tastatur schließen"
    step_type: "normal"
    confirm_in_c1: false
  - id: "review_payment"
    action: "click 'com.caddie.studybank:id/btn_send'"
    narration: "Überweisungsdaten prüfen..."
    confirmation_text: "Überweisungsdaten prüfen"
    step_type: "consequential"
    consequential: true
    min_narration_ms: 600
  - id: "send_payment"
    action: "click 'com.caddie.studybank:id/btn_confirm'"
    narration: "Überweisung senden..."
    confirmation_text: "Überweisung verbindlich bestätigen"
    step_type: "commit"
    commit: true
    min_narration_ms: 800
error_steps: ["input_amount"]
c2_summary_lines:
  - "Überweisung an Study Vendor GmbH: 30,00 EUR"
verification:
  - id: "v_payment_completed"
    assertion: "Überweisung erscheint in den Umsätzen und die Kontoübersicht ist sichtbar"
    check_type: "text_present"
    parameters:
      text: "Study Vendor GmbH"
    screenshot_evidence: true
max_duration_s: 120
per_gate_timeout_s: 30
